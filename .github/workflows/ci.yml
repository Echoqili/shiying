name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt ruff
      - name: Prepare FFmpeg
        run: python scripts/prepare_tools.py --download
      - name: Lint
        run: python -m ruff check main.py videodesk scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
